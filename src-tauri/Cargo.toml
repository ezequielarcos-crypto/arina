[package]
name = "arina"
version = "1.0.0"
description = "Arina — ERP para negocio de comidas"
edition = "2021"

[lib]
name = "arina_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
flate2 = "1"

[target."cfg(target_os = \"linux\")".dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
